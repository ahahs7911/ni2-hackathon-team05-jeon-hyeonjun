<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서번 점검길잡이 — 공조기 고장 증상별 점검 순서 안내</title>
<meta name="description" content="안전 확인 → 제품 선택 → 고장 증상 선택 순서로 묻고, 단계별 점검과 A/S 요청문을 안내하는 챗봇 시제품입니다.">
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --ink:#1c2430; --sub:#5b6675; --line:#dde2e8;
    --brand:#202d36; --brand-weak:#e9edf5; --accent:#7288b0;
    --ok:#1d7a46; --ok-weak:#e7f5ec;
    --bad:#b3261e; --bad-weak:#fdecea;
    --warn:#8a5a00; --warn-weak:#fff4dc;
    --unk:#5b6675; --unk-weak:#eef0f3;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6; font-size:16px;
    word-break:keep-all; overflow-wrap:anywhere;
  }
  .wrap{max-width:760px; margin:0 auto; padding:0 16px}

  /* 머리글 */
  header{background:#202d36; color:#fff; padding:10px 0; position:sticky; top:0; z-index:5}
  .brand{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .brand h1{font-size:1.15rem; margin:0; letter-spacing:-.01em}
  .logo{height:34px; width:auto; display:block}
  .badge{font-size:.72rem; background:rgba(255,255,255,.18); padding:2px 8px; border-radius:99px}
  .head-btns{margin-left:auto; display:flex; gap:6px}
  .hbtn{font:inherit; font-size:.85rem; font-weight:700; min-height:40px; padding:6px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.5); background:rgba(255,255,255,.12); color:#fff; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center}
  .hbtn.fire{background:#fff; color:var(--bad); border-color:#fff}

  /* 대화 */
  main{padding:14px 0 120px}
  .row{display:flex; gap:8px; margin:12px 0; align-items:flex-start; scroll-margin-top:72px; scroll-margin-bottom:90px}
  .row.me{justify-content:flex-end}
  .av{width:36px; height:36px; border-radius:50%; background:#202d36 url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADgAAAA4CAYAAACohjseAAANL0lEQVR42t2ae4xc1X3Hv7/zuPfOzD5wiImx6lZJAwKvWjUCFaiq1ts2tRKi1g922kSJSfPYlQiWvRjb8cb4zi02Nrh+CYK0LinCJFU7gx9VgopLqrVQVagK5Y/GJi20pbIKJE6AfczMfZxzfv1jZmI32Ozd3Vn+6JHmn5HmnvuZ3/tBWMAJw1AAq0QUDZrOd9vHn+03U+lNAG6BNTcx+OMALwNTH4MDIqLZnstgJ4SElEpkNl13aNuak0NDVVmrle1c35Hmh8ZUrdZEudy6cOuDp3pJeKsd23Vg/k0QrVDaAzODnYNzFswOzDz7k5mZpGQltUhNvOHw9rVPhiGLKCI3nzedM+BQtSprbbB77j+5ggI1QowN2g9WAASTxrDWAAwLAhggAhOQQ3KXwiWNzx8eW/+dMJxQl2rIYgLSULUqauWyHd5e7e//cHELA3d7fmFJljRhjGmrD4s8anglOC21SNPmFw7tWPftcGJCRYPzhwMAkd/WwLVy2Y7uPbW2f2nxJe0X7mN2S5qNKWNMxkSQrc884YRkrTyRJPGGQzvWfXt4eFwvFC6XBDvGvXHjEd9f8bGDSnt3WWtgstQQIDEPoPfCCdbaF2kS33lox5pjw+Pj+ujISIYuHMpjbxvD478Q9PhVLyje1pyZskxMBBILvfxSuCRufPHw2LonhofH9dGj3YF7X8AO3KY/PXGjV/SfVkp/NG7OGCKhunExM7MQ0intyTSuf+nQ2PrHuym5zlFXVMty2d6956kbPM//eyHktXGz3n04z5Nx3PjykbH1j4fhhIpGBrsKd1knE4ahqNXK9msP/uXyQPvPCCmvTZOmJaIuw/kybTS/cmTHur8YHh/XCwkFuVWUmalcq4mVZyGnC/5zflC8JW5Od0Ny3A7yLIRk7fkyjhsjh3esPRqGVQ842xW4SqXCRMRXBKxWWZbLZDfvPfHNUs9VdzVmJjMi0vMiAhzAjpiIBEkSAoIkhJSI45mvHt6x/jEsymECLkKqS51KuUx29MGTn/a90l3NxpSZDxwDDgxWWkutfeGcRZI0DFm+ILRqNhszDx35xvrHNu/93seUtD3EpKxBw8i4oTNBCPScvbMyjlXpQzTz07ffORLRu23B8UUJMlNYqdCFpauKwczkD5TSv5iZlOcaCpjZas+XUmqkSfN1hvueIPX9NI7P+f6yt4qNZ5tRFJkt+4+VjOldqpQeIObfZbjPKOVdZ42BtSZux9e5XO2k1MI681rcSH59Kc42okqFQcQKAMJKRUZRZEb3/tq9hVL/LzXq787J7piZiYBCsVemaXzWung/hP/Uwa2r65dzYtHWDXUAdQCvA3g6fGRiV70xdQcgthVLfTc2GzMAeE45hLGpK/VcdSN4ckv09SgKARUBhsIwFFFU4Xsfqn2E2f83CNHDxlDepzPYSaEECQF2brd9s/nAoUPlZgtmQp0buMArz57l9j+KjuowM5XLNYEhoJO83xk+Hny45+oxAbGT2ZGx1gki0fnNLKbBQkqA3TQhueHPtg39KAwrpIBVAiDD9tRdfqmnr217KqfknFJaAJjKTPa5w19f83QHLIpW2Siii94xiv6v+255O4tayzGE4RkZRYMxgF2b9x3/J62C72gS/cZmLo+pEEDOGlMo9vU363wXQLuACUkAsGX/6RKbxqtS6WXGGqYcSTgzs5QKRGI6TuLVD+9c/0I7EzF5/vErvefw+Lg6OjKSbdx9/NbAD04zu15rDfIVynBKajImfVOo6esPbN1Qb4HYeLVf7LnWmMxRvgqDhRBOCIk0afxxC+7FTprFC/HxR0dGsuHxF/XDO9e/YLL4j4SQEEK4PM8lQBiTuaDYs9yZvt//   .row.bot .bub{background:var(--card); border:1px solid var(--line); border-radius:4px var(--radius) var(--radius) var(--radius); padding:12px 14px; max-width:calc(100% - 42px); min-width:0}
  .row.bot .bub.wide{flex:1 1 auto}
  .row.me .bub{background:var(--brand); color:#fff; border-radius:var(--radius) 4px var(--radius) var(--radius); padding:9px 14px; max-width:82%; font-weight:600}
  .bub h3{font-size:1.02rem; margin:0 0 4px}
  .bub p{margin:0 0 6px}
  .bub p:last-child{margin-bottom:0}
  .hint{color:var(--sub); font-size:.86rem; margin:2px 0 8px}
  .step-no{font-size:.8rem; color:var(--sub); font-weight:700}

  /* 체크리스트 */
  .ck{display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:2px solid var(--line); border-radius:12px; margin:8px 0; cursor:pointer; min-height:48px; background:#fff}
  .ck input{width:22px; height:22px; margin:2px 0 0; flex:none; accent-color:var(--ok); cursor:pointer}
  .ck.on{border-color:var(--ok); background:var(--ok-weak)}
  .ck-count{font-size:.85rem; color:var(--sub); margin:4px 0 8px; font-weight:700}

  /* 버튼 */
  .grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:6px}
  .opt{
    border:2px solid var(--line); background:#fff; border-radius:12px; padding:12px 8px;
    font:inherit; font-size:.95rem; cursor:pointer; text-align:center; color:var(--ink);
    min-height:84px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  }
  .opt .ic{font-size:1.5rem; line-height:1}
  .opt b{font-weight:700}
  .opt small{font-size:.78rem; color:var(--sub); line-height:1.35}
  .opt[aria-pressed="true"]{border-color:var(--accent); background:var(--brand-weak)}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px}
  .chip{font:inherit; font-size:.92rem; padding:8px 14px; min-height:44px; border-radius:99px; border:2px solid var(--line); background:#fff; color:var(--ink); cursor:pointer}
  .chip[aria-pressed="true"]{border-color:var(--accent); background:var(--brand-weak); color:var(--brand); font-weight:700}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    font:inherit; font-weight:700; border-radius:12px; padding:12px 18px; cursor:pointer;
    border:2px solid transparent; min-height:48px; text-decoration:none;
  }
  .btn-primary{background:var(--brand); color:#fff; width:100%; font-size:1.02rem}
  .btn-primary:disabled{background:#aab3bc; cursor:not-allowed}
  .btn-ghost{background:#fff; color:var(--brand); border-color:var(--brand)}
  .btn-fire{background:var(--bad); color:#fff; border-color:var(--bad); width:100%; margin:0 0 12px; font-size:1.02rem}
  .btn-all{background:#fff; color:var(--ok); border-color:var(--ok); width:100%; margin:2px 0 4px}
  .btn-all[aria-pressed="true"]{background:var(--ok-weak)}
  .btn-as{width:100%; font-size:1.05rem; margin-top:4px}
  .as-steps{margin:8px 0 10px; padding-left:22px; font-size:.9rem}
  .as-steps li{margin:2px 0}
  .as-done{margin-top:8px; font-weight:700; color:var(--ok); background:var(--ok-weak); border-radius:10px; padding:8px 12px; font-size:.9rem}
  .as-done a{color:var(--ok)}
  .btn-back{background:#fff; color:var(--sub); border-color:var(--line); width:100%; margin-top:10px; font-weight:600}
  .answers{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px}
  .ans{font:inherit; font-weight:700; border-radius:10px; padding:10px 6px; min-height:48px; cursor:pointer; border:2px solid}
  .ans.ok{background:var(--ok-weak); color:var(--ok); border-color:var(--ok)}
  .ans.bad{background:var(--bad-weak); color:var(--bad); border-color:var(--bad)}
  .ans.unk{background:var(--unk-weak); color:var(--unk); border-color:#c6ccd4; font-weight:600}
  .locked button:disabled,.locked input:disabled{cursor:default}
  .locked button:disabled:not([aria-pressed="true"]){opacity:.45}
  .locked .ck{cursor:default}

  /* 점검 단계 */
  .step-head{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:4px}
  .stage{font-size:.75rem; padding:2px 8px; border-radius:99px; background:var(--unk-weak); color:var(--sub); font-weight:700}
  .stage.s1{background:var(--bad-weak); color:var(--bad)}
  .stage.s2{background:var(--brand-weak); color:var(--brand)}
  .stage.s3{background:var(--warn-weak); color:var(--warn)}
  dl{margin:6px 0 0}
  dt{font-weight:700; font-size:.84rem; color:var(--sub); margin-top:6px}
  dd{margin:0}
  .pro{display:inline-block; font-size:.8rem; background:var(--bad); color:#fff; padding:1px 8px; border-radius:6px; font-weight:700}
  .progress{height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin:4px 0 8px}
  .progress > div{height:100%; background:var(--accent)}

  /* 결과 */
  .stopbox{background:var(--bad); color:#fff; border-radius:12px; padding:12px 14px}
  .verdict{border-radius:12px; padding:12px 14px; border:2px solid; margin-bottom:8px}
  .verdict.call{background:var(--bad-weak); border-color:var(--bad)}
  .verdict.self{background:var(--warn-weak); border-color:#d9a640}
  .verdict.none{background:var(--ok-weak); border-color:var(--ok)}
  .cause{border-left:4px solid var(--accent); padding:8px 12px; margin:10px 0; background:#fafbfc; border-radius:0 10px 10px 0}
  .cause .why{font-size:.86rem; color:var(--sub)}
  .who{font-size:.76rem; font-weight:700; padding:2px 8px; border-radius:6px; margin-left:6px; white-space:nowrap}
  .who.self{background:var(--ok-weak); color:var(--ok)}
  .who.call{background:var(--bad-weak); color:var(--bad)}
  .who.check{background:var(--brand-weak); color:var(--brand)}
  .cols{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .cols ul{margin:4px 0 0; padding-left:18px}
  .colbox{border-radius:12px; padding:10px 12px}
  .colbox.self{background:var(--ok-weak)}
  .colbox.call{background:var(--bad-weak)}
  textarea{width:100%; font:inherit; font-size:.9rem; line-height:1.55; min-height:280px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; color:var(--ink)}
  .row-btns{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px}
  .row-btns .btn{flex:1 1 160px}

  /* 화재 */
  .fire{background:#7f1d1d; color:#fff; border-radius:12px; padding:12px 14px}
  .fire h3{color:#fff}
  .fire ol{margin:6px 0 10px; padding-left:20px}
  .fire li{margin:2px 0}
  .btn-119{display:flex; width:100%; background:#fff; color:#b3261e; font-size:1.2rem; border-color:#fff}
  .fire .small{font-size:.85rem; opacity:.9; margin:6px 0 0}

  /* 입력창 */
  .composer{position:fixed; left:0; right:0; bottom:0; background:rgba(244,246,248,.96); border-top:1px solid var(--line); padding:10px 0; z-index:5}
  .composer form{display:flex; gap:8px}
  .composer input{flex:1; min-width:0; font:inherit; padding:10px 12px; min-height:48px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink)}
  .composer button{width:auto; flex:none; min-width:84px}
  input:focus,textarea:focus,button:focus-visible{outline:3px solid #9fb0d0; outline-offset:1px}

  .toast{position:fixed; left:50%; bottom:86px; transform:translateX(-50%); background:#1c2430; color:#fff; padding:10px 16px; border-radius:10px; font-size:.9rem; opacity:0; pointer-events:none; transition:opacity .2s; z-index:9}
  .toast.show{opacity:1}
  footer{font-size:.8rem; color:var(--sub); padding:4px 0 0}
  footer p{margin:4px 0}
  @media (max-width:560px){
    body{font-size:15px}
    .cols{grid-template-columns:1fr}
    .brand h1{font-size:1.05rem}
    .badge{display:none}
    .logo{height:24px}
    .brand{flex-wrap:nowrap; gap:6px}
    .brand h1{font-size:.98rem; white-space:nowrap}
    .head-btns{gap:4px}
    .hbtn{padding:6px 8px; font-size:.78rem; white-space:nowrap}
  }
  @media (max-width:345px){ .brand h1{font-size:.85rem} .hbtn{padding:6px 6px} .logo{height:22px} }
</style>
</head>
<body>

const $ = (id)=>document.getElementById(id);
const chat = $("chat");
const esc = (s)=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = (n)=>String(n).padStart(2,"0");
const nowHM = ()=>{ const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

let state;
let hist = [];   // 지나온 질문 기록 (이전 단계로 돌아가기용)
function resetState(){
  state = {stage:"safety", prod:null, sym:null, since:"", safetyAt:"", steps:[], answers:[], stopped:null, active:null};
  hist = [];
}
/* 질문을 띄우기 직전 상태를 저장해 두었다가, '이전 단계로'를 누르면 그 질문부터 다시 묻습니다 */
function enter(name, arg){
  const {active, ...rest} = state;
  hist.push({name, arg, idx: chat.children.length, snap: JSON.parse(JSON.stringify(rest))});
}
const ASK = {
  safety: ()=>askSafety(), product: ()=>askProduct(), symptom: ()=>askSymptom(),
  since: ()=>askSince(), extra: ()=>askExtraSafety(), step: (i)=>askStep(i)
};
function goBack(){
  const asking = !["done","stopped"].includes(state.stage);
  if(asking) hist.pop();                 // 지금 떠 있는 질문은 버림
  const target = hist.pop();             // 바로 앞 질문
  if(!target){ start(); return; }
  while(chat.children.length > target.idx) chat.lastChild.remove();
  state = {...target.snap, active:null};
  ASK[target.name](target.arg);
}
const BACK_BTN = `<button class="btn btn-back" type="button" data-back>← 이전 단계로</button>`;

function bubble(who, html, wide){
  const row = document.createElement("div");
  row.className = "row " + who;
  row.innerHTML = who==="bot"
    ? `<div class="av" aria-hidden="true"></div><div class="bub${wide?" wide":""}">${html}</div>`
    : `<div class="bub">${html}</div>`;
  chat.appendChild(row);
  requestAnimationFrame(()=>row.scrollIntoView({behavior:"smooth", block: who==="bot" ? "start" : "end"}));
  return row.querySelector(".bub");
}
const bot = (html, wide)=>bubble("bot", html, wide);
const me = (text)=>bubble("me", esc(text));
function lock(el){
  if(!el) return;
  el.querySelectorAll("button,input").forEach(b=>b.disabled=true);
  el.classList.add("locked");
}
function lockAll(){ chat.querySelectorAll(".bub:not(.locked)").forEach(lock); }
function pressed(el, attr, val){
  el.querySelectorAll(`[${attr}]`).forEach(b=>b.setAttribute("aria-pressed", b.getAttribute(attr)===val ? "true":"false"));
}

/* 체크리스트 말풍선 (모두 체크해야 버튼이 열림) */
function checklist(title, hint, items, btnText, onDone, withFire){
  const b = bot(`${withFire?`<button class="btn btn-fire" data-fire type="button">🔥 타는 냄새·연기·스파크가 있어요 (바로 누르세요)</button>`:""}
    <h3>${title}</h3><p class="hint">${hint}</p>
    <button class="btn btn-all" data-all type="button" aria-pressed="false">☑️ 전체 체크</button>
    <div>${items.map((t,i)=>`<label class="ck"><input type="checkbox" data-i="${i}"><span>${t}</span></label>`).join("")}</div>
    <div class="ck-count">0 / ${items.length} 확인</div>
    <button class="btn btn-primary" data-go type="button" disabled>${btnText}</button>
    ${hist.length>1?BACK_BTN:""}`, true);
  const boxes = [...b.querySelectorAll("input[type=checkbox]")];
  const go = b.querySelector("[data-go]");
  const all = b.querySelector("[data-all]");
  const refresh = ()=>{
    boxes.forEach(x=>x.closest(".ck").classList.toggle("on", x.checked));
    const n = boxes.filter(y=>y.checked).length;
    b.querySelector(".ck-count").textContent = `${n} / ${items.length} 확인`;
    go.disabled = n!==items.length;
    all.setAttribute("aria-pressed", n===items.length ? "true":"false");
    all.textContent = n===items.length ? "☐ 전체 해제" : "☑️ 전체 체크";
  };
  boxes.forEach(x=>x.addEventListener("change", refresh));
  all.onclick = ()=>{
    const on = !boxes.every(x=>x.checked);
    boxes.forEach(x=>x.checked = on);
    refresh();
  };
  go.onclick = ()=>{ lock(b); onDone(items.length); };
  const f = b.querySelector("[data-fire]");
  if(f) f.onclick = ()=>{ lock(b); me("🔥 타는 냄새·연기·스파크가 있어요"); fireStop("타는 냄새·연기·스파크가 있다고 알려 주셨습니다."); };
  state.active = b;
  return b;
}

function fireBox(reason){
  return `<div class="fire" role="alert">
    <h3>🔥 화재 위험 — 바로 119에 신고하세요</h3>
    <p style="margin:0">${reason}</p>

      <li>불꽃·연기가 없고 가까이 가도 안전할 때만, 떨어진 분전반에서 <b>전원을 차단</b>합니다.</li>
      <li><b>119</b>에 "공조기(기계실)에서 타는 냄새·스파크"라고 장소와 함께 신고합니다.</li>
      <li>물을 뿌리지 않습니다(감전 위험). 신고 후 ㈜서번에도 알립니다.</li>

  </div>`;
}
function fireStop(reason){
  lockAll();

}
function restartBubble(){
  const b = bot(`<div class="row-btns" style="margin:0"><button class="btn btn-ghost" type="button" data-r>↺ 처음부터 다시</button></div>${BACK_BTN.replace("이전 단계로","잘못 눌렀어요 — 이전 단계로")}`);

function startSteps(){

function askStep(i){
  enter("step", i);

  const b = bot(`<div class="step-no">단계 ${i+1} / ${n}</div>

/* =========================================================
   4) 결과: 원인 후보 · 판단 · A/S 요청문
   ========================================================= */
function analyze(){
  const score = {}, evidence = {};
  state.answers.forEach((a,i)=>{
    if(a!=="bad") return;
    const st = state.steps[i];
    for(const [c,w] of Object.entries(st.onBad)){
      score[c] = (score[c]||0)+w;
      (evidence[c] = evidence[c]||[]).push(`${i+1}단계 '${st.title}' → ${st.bad}`);
    }
  });
  return Object.keys(score).sort((a,b)=>score[b]-score[a]).slice(0,3)
    .map(k=>({key:k, ...CAUSES[k], evidence:evidence[k]}));
}

function showFinal(){
  state.stage = "done";
  const causes = analyze();
  const stopStep = state.stopped!==null ? state.steps[state.stopped] : null;
  const v = stopStep || causes.some(c=>c.who==="call") ? "call" : causes.length ? "self" : "none";
  const unk = state.answers.filter(a=>a==="unk").length;

  if(stopStep){
    bot(stopStep.fire ? fireBox(stopStep.stop)
      : `<div class="stopbox"><h3 style="color:#fff">⛔ 점검 중단</h3><p style="margin:0">${stopStep.stop}</p></div>`, true);
  }

  const vText = {
    call:["call","📞 A/S 요청을 권장합니다","직접 고치기 어려운 원인이 있습니다. 아래 요청문을 복사해 ㈜서번에 보내 주세요."],
    self:["self","🛠️ 직접 조치 후 다시 확인해 보세요","현장에서 할 수 있는 조치가 있습니다. 조치 후에도 증상이 계속되면 A/S를 요청하세요."],
    none:["none","🔍 점검 항목에서 이상을 찾지 못했습니다","증상이 계속된다면 다른 원인일 수 있으니 A/S를 요청하세요."]
  }[v];
  const whoLabel = {self:"직접 조치 가능", call:"A/S 필요", check:"담당자 확인"};
  bot(`<div class="verdict ${vText[0]}"><h3>${vText[1]}</h3><p style="margin:0">${vText[2]}${unk?` 확인하지 못한 단계가 ${unk}개 있습니다.`:""}</p></div>
    <h3>원인 후보 <span class="hint">(가능성 높은 순 · 확정 진단 아님)</span></h3>
    ${causes.length ? causes.map((c,i)=>`<div class="cause"><b>${i+1}. ${c.name}</b><span class="who ${c.who}">${whoLabel[c.who]}</span>
      <div class="why">근거: ${c.evidence.join(" / ")}</div><div>조치: ${c.fix}</div></div>`).join("")
      : `<p class="hint">'이상'으로 답한 단계가 없어 원인 후보를 만들지 못했습니다.</p>`}`, true);

  bot(`<h3>직접 조치 vs A/S 호출 기준</h3>
    <div class="cols">
      <div class="colbox self"><b>✅ 여기까지는 직접 가능</b><ul>
        <li>조작반 설정·스케줄을 원래대로 되돌리기</li><li>급기구·흡입구 앞 장애물 치우기</li>
        <li>전원 차단 후 필터 청소·교체 (설명서 절차)</li><li>드레인판 고인 물·이물질 치우기</li><li>풀린 패널 나사 조이기 (운전 정지 후)</li></ul></div>
      <div class="colbox call"><b>📞 이 경우는 바로 A/S 요청</b><ul>
        <li>타는 냄새, 금속 긁히는 소리, 심한 진동</li><li>차단기가 내려감 / 같은 경보가 반복됨</li>
        <li>전기부품 쪽 누수</li><li>벨트·베어링·모터·밸브·날개 이상</li><li>배관 누수, 코일·HEPA 작업, 냉매·전기 작업</li></ul></div>
    </div>`, true);

  const b = bot(`<h3>결과 요약 · A/S 요청문</h3>
    <p class="hint">빈칸(설치 장소, 모델명, 경보 표시, 이름·연락처)을 채운 뒤 아래 파란 버튼을 눌러 주세요.</p>

      <li><b>붙여넣기</b> — 접수 칸에 붙여 넣고(PC: Ctrl+V, 휴대폰: 길게 눌러 '붙여넣기') 보내세요.</li>
    </ol>
    <a class="btn btn-primary btn-as" data-as href="${AS_URL}" target="_blank" rel="noopener">📋 복사하고 ㈜서번 A/S 접수로 이동 →</a>

    <div class="row-btns">
      <a class="btn btn-ghost" data-call href="tel:0518317676">📞 ㈜서번 전화 051-831-7676</a>

    </div>
    <button class="btn btn-back" type="button" data-back>← 마지막 단계 다시 답하기</button>`, true);
  const ta = b.querySelector("[data-req]");
  ta.value = buildRequest(causes, v);
  // 링크 기본 동작(새 창 열기)은 그대로 두고, 누르는 순간 복사만 함께 합니다
  b.querySelector("[data-as]").addEventListener("click", ()=>{
    copyText(ta);

  b.querySelector("[data-r]").onclick = start;

function sinceText(){
  const o = SINCE.find(x=>x.label===state.since);
  if(!o) return "(미입력)";
  if(o.from===null) return "모름";
  const day=(n)=>{ const d=new Date(); d.setDate(d.getDate()-n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
  if(o.to===null) return `${o.label} (${day(o.from)} 이전)`;
  if(o.from===o.to) return `${o.label} (${day(o.from)})`;
  return `${o.label} (${day(o.to)} ~ ${day(o.from)} 사이)`;
}

function buildRequest(causes, v){
  const p = PRODUCTS[state.prod], s = SYMPTOMS[state.sym];
  const d = new Date();
  const when = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const L = [];
  L.push("[㈜서번 공조 설비 A/S 요청]", "");
  L.push(`■ 요청 일시: ${when}`);
  L.push("■ 요청자(회사·이름): ");
  L.push("■ 연락처: ");
  L.push("■ 설치 장소: ");
  L.push(`■ 제품: ${state.prod==="unknown" ? "확인 못함(공기조화기 기준으로 점검)" : p.name}`);
  L.push("■ 모델명(명판): ");
  L.push("");
  L.push(`■ 증상: ${s.name}`);
  L.push(`■ 시작 시점: ${sinceText()}`);
  L.push("■ 조작반 경보 표시: ");
  L.push(`■ 안전 확인: ${state.safetyAt} 체크 완료`);
  L.push("");
  L.push("■ 현장 점검 결과");
  state.steps.forEach((st,i)=>{
    const a = state.answers[i];
    if(a===undefined) return;
    L.push(`  ${i+1}. ${st.title}: ${ANS_LABEL[a]}${a==="bad"?` (${st.bad})`:""}`);
  });
  if(state.stopped!==null){
    L.push(`  ※ ${state.stopped+1}단계에서 위험 신호로 점검을 중단하고 운전을 정지함`);
    if(state.steps[state.stopped].fire) L.push("  ※ 화재 위험 신호(타는 냄새·연기·스파크) — 119 신고 안내함");
  }
  L.push("");
  L.push("■ 추정 원인 후보 (현장 점검 기준, 확정 아님)");
  if(causes.length) causes.forEach((c,i)=>L.push(`  ${i+1}. ${c.name}`));
  else L.push("  - 점검 항목에서 이상을 찾지 못함");
  L.push("");
  L.push("■ 현장에서 이미 한 조치: ");
  L.push(`■ 요청 구분: ${v==="call"?"A/S 출동 요청":"원격 상담 요청(조치 후에도 증상 지속 시 출동 요청)"}`);
  L.push("", "— 서번 점검길잡이(시제품)로 작성", "㈜서번 홈페이지: http://seobun.co.kr");
  return L.join("\n");
}

async function copyText(ta){
  try{ await navigator.clipboard.writeText(ta.value); toast("요청문을 복사했습니다"); }
  catch(e){
    ta.focus(); ta.select();
    try{ document.execCommand("copy"); toast("요청문을 복사했습니다"); }
    catch(_){ toast("복사가 막혀 있습니다. 글을 길게 눌러 직접 복사해 주세요"); }
  }
}
function toast(msg){
  const el=$("toast"); el.textContent=msg; el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"), 2000);
}

/* =========================================================
   5) 말로 적기 (키워드로 버튼에 연결 — AI 연결은 다음 단계)
   ========================================================= */
function matchFrom(list, text){
  let best=null, bestScore=0;
  list.forEach(([key,kw])=>{
    const score = kw.reduce((a,k)=>a + (text.includes(k)?1:0), 0);
    if(score>bestScore){ best=key; bestScore=score; }
  });
  return best;
}
$("composer").addEventListener("submit", (e)=>{
  e.preventDefault();
  const t = $("msg").value.replace(/\s+/g," ").trim();
  if(!t) return;
  $("msg").value = "";
  me(t);
  const low = t.toLowerCase();

  if(FIRE_WORDS.test(t)){ fireStop("적어 주신 내용에 화재 위험 신호(타는 냄새·연기·스파크)가 있습니다."); return; }

  if(state.stage==="product"){
    const k = matchFrom(Object.entries(PRODUCTS).map(([k,p])=>[k,p.keywords]), low);
    if(k){ bot(`'<b>${PRODUCTS[k].name}</b>'(으)로 보고 진행하겠습니다. 다르면 ↺ 처음부터를 눌러 주세요.`); chooseProduct(k, true); }
    else bot("어떤 제품인지 찾지 못했습니다. 위 버튼에서 골라 주세요. 모르시면 '잘 모르겠어요'를 눌러 주세요.");
    return;
  }
  if(state.stage==="symptom"){
    const list = PRODUCTS[state.prod].symptoms.map(k=>[k,SYMPTOMS[k].keywords]);
    const k = matchFrom(list, low);
    if(k){ bot(`적어 주신 내용은 '<b>${SYMPTOMS[k].name}</b>' 증상으로 보여 이것으로 진행하겠습니다.`); chooseSymptom(k, true); }
    else bot("어떤 증상인지 찾지 못했습니다. 위 버튼에서 가장 가까운 증상을 눌러 주세요.");
    return;
  }
  const guide = {
    safety:"먼저 위의 안전 항목을 모두 체크해 주세요.",
    since:"위 버튼에서 언제부터 그랬는지 골라 주세요.",
    extra:"위의 주의사항을 체크해 주세요.",
    step:"위 단계를 확인하신 뒤 정상 / 이상 / 확인 못함 버튼을 눌러 주세요.",
    done:"점검이 끝났습니다. 요청문을 복사하시거나, ← 버튼으로 이전 단계로 돌아갈 수 있습니다.",
    stopped:"안전 조치가 먼저입니다. 다시 점검하시려면 ↺ 처음부터를 눌러 주세요."
  }[state.stage];
  bot(guide || "위 버튼으로 답해 주세요.");
});
